server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    absolute_redirect off;
    port_in_redirect off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        image/svg+xml;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"native-ai-organ"}';
    }

    # 静态资产（css/js/字体/图片/图数据）强缓存
    location ~* \.(css|js|json|png|jpg|jpeg|svg|ico|webp|woff2?|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML 入口协商缓存，确保内容更新即时生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
